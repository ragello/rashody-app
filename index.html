
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f3ff">
<title>Мой бюджет</title>
<style>
:root{
 --bg:#f5f3ff;--card:#fff;--ink:#28243a;--muted:#817d91;
 --line:#e9e5f2;--purple:#7057d9;--purple2:#eee9ff;
 --green:#16866a;--greenbg:#e2f7ee;
 --red:#d64e68;--redbg:#fff0f2;
 --blue:#3985d6;--orange:#e69a38;--shadow:0 8px 25px #5140800c
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
button,input,select{font:inherit}
button{border:0;border-radius:13px;padding:11px 15px;background:var(--purple);color:white;cursor:pointer;font-weight:700}
button:disabled{opacity:.5}
.secondary{background:var(--purple2);color:#5742ad}
.danger{background:var(--redbg);color:var(--red)}
.wrap{max-width:960px;margin:auto;padding:18px 15px 60px}
header,.row,.between,.tabs,.actions{display:flex;align-items:center;gap:10px}
header,.between{justify-content:space-between}
header{margin-bottom:18px}
h1{font-size:23px;margin:0}
h2{font-size:19px;margin:0 0 13px}
h3{font-size:16px;margin:12px 0}
.muted{color:var(--muted);font-size:13px}
.status{font-size:12px;text-align:right;color:var(--green);margin-bottom:5px}
.tabs{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:17px;padding:4px 0}
.tabs button{min-width:0;width:100%;white-space:nowrap;background:transparent;color:var(--muted);padding:10px 6px}
.tabs button.active{background:var(--purple);color:white;box-shadow:0 4px 12px #7057d944}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:16px;margin-bottom:13px;min-width:0;box-shadow:var(--shadow)}
.summary-card{position:relative;overflow:hidden}
.summary-card.balance-card{background:linear-gradient(135deg,#7057d9,#9278ed);color:white;border:0;box-shadow:0 9px 24px #7057d933}
.balance-card .label,.balance-card .big{color:white}
.account-card .account-value {
    color: var(--ink) !important;
}
 .balance-card:after{content:"";position:absolute;width:115px;height:115px;border-radius:50%;background:#ffffff18;right:-35px;top:-40px}
.income-card{border-top:4px solid #36b98d}
.expense-card{border-top:4px solid #ed7186}
.label{font-size:13px;color:var(--muted)}
.big{font-size:clamp(20px,4vw,28px);font-weight:800;margin-top:7px;overflow-wrap:anywhere}
.green{color:var(--green)}.red{color:var(--red)}
.section{margin-top:22px}
.tx,.category{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}
.tx:last-child,.category:last-child{border-bottom:0}
.dot{width:42px;height:42px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:21px}
.txmain{flex:1;min-width:0}
.txmain strong{display:block;overflow-wrap:anywhere}
.txmain small{display:block;color:var(--muted);font-size:12px}
.amount{font-weight:800;white-space:nowrap}
.actions button{padding:7px 9px;font-size:12px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}
.field label{font-size:13px;color:var(--muted);font-weight:650}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--ink)}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.full{grid-column:1/-1}
.empty{text-align:center;padding:25px;color:var(--muted)}
.auth{max-width:420px;margin:8vh auto;background:white;padding:23px;border-radius:22px;border:1px solid var(--line);box-shadow:var(--shadow)}

.auth{
 max-width:430px;margin:clamp(28px,9vh,90px) auto;background:linear-gradient(155deg,#fff 0%,#fbfaff 100%);
 padding:clamp(22px,5vw,32px);border-radius:26px;border:1px solid #e6e0f5;
 box-shadow:0 18px 55px #51408016;position:relative;overflow:hidden
}
.auth:before{
 content:"";position:absolute;width:190px;height:190px;border-radius:50%;
 right:-92px;top:-105px;background:radial-gradient(circle,#eee9ff 0%,#f7f4ff 70%,transparent 72%);
 pointer-events:none
}
.auth h1{position:relative;font-size:25px;letter-spacing:-.5px;margin-bottom:5px}
.auth>p{position:relative;margin:0 0 27px}
.auth h2{font-size:20px;margin:0 0 17px}
.auth .field{gap:7px;margin-bottom:15px}
.auth .field label{color:#625b78}
.auth input{padding:14px 15px;border-radius:14px;background:#fff;transition:border-color .18s,box-shadow .18s}
.auth input:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 3px #7057d91c}
.auth #authSubmit,.auth #authToggle{width:100%;min-height:47px;border-radius:14px}
.auth #authToggle{margin-top:9px}
.auth .notice{line-height:1.45}
@media(max-width:600px){.auth{margin:5vh 12px 20px}}

.notice{background:var(--purple2);padding:12px;border-radius:12px;font-size:13px;margin-top:12px}
.account-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.account-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:var(--shadow)}
.account-card .account-name{font-size:13px;color:var(--muted)}
.account-card .account-value{font-size:22px;font-weight:850;margin-top:5px;overflow-wrap:anywhere}
.transfer-card{border:1px solid #ddd5f4;background:#faf8ff}
.transfer-row{display:grid;grid-template-columns:minmax(0,1fr) 64px minmax(0,1fr);gap:18px;align-items:stretch;padding:6px 0 10px}
.transfer-side{display:flex;flex-direction:column;justify-content:center;min-width:0}
.transfer-side>label{text-align:center;margin-bottom:8px}
.transfer-side-value{min-height:54px;padding:12px 14px;border-radius:16px;display:flex;align-items:center;justify-content:center;line-height:1.25}
.transfer-arrow{width:52px;height:52px;margin:auto;display:grid;place-items:center;border-radius:50%;background:var(--purple2);border:1px solid #d9d0f4;font-size:24px;line-height:1;color:var(--purple);font-weight:850;box-shadow:0 3px 10px #7057d91c;cursor:pointer}
.transfer-side-value{border:1px solid var(--line);background:#fff;font-weight:800;text-align:center}.transfer-side-value.card-side{color:#5742ad}.transfer-side-value.cash-side{color:#16866a}
@media(max-width:600px){.account-grid{grid-template-columns:1fr}.transfer-row{grid-template-columns:minmax(0,1fr) 54px minmax(0,1fr);gap:8px;padding-top:4px}.transfer-side-value{font-size:12px;padding:10px 6px;min-height:50px}.transfer-arrow{width:46px;height:46px;font-size:21px}}
.warn{background:var(--redbg);color:#a83248}
.hidden{display:none!important}
input[type=color]{appearance:none;-webkit-appearance:none;width:58px;height:46px;padding:3px;border:1px solid #ddd5f4;border-radius:8px;overflow:hidden;background:white;cursor:pointer}input[type=color]::-webkit-color-swatch-wrapper{padding:0}input[type=color]::-webkit-color-swatch{border:0;border-radius:4px}
.color-preview{width:46px;height:46px;border-radius:6px;border:0;box-shadow:none}
.color-row{display:flex;align-items:center;gap:13px}
.month-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:5px 0 15px}
.month-nav button{width:44px;height:44px;padding:0;font-size:24px}
.stat-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-mini{background:#f7f5ff;border-radius:14px;padding:12px;min-width:0}
.stat-mini strong{display:block;font-size:18px;overflow-wrap:anywhere}
.chart-legend{display:flex;flex-wrap:wrap;gap:9px 14px;font-size:12px;margin-top:13px}
.legend-item{display:flex;align-items:center;gap:6px}
.legend-dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.pie-wrap{display:flex;justify-content:center;padding:8px 0}.pie{width:min(260px,72vw);aspect-ratio:1;border-radius:50%;margin:8px auto;position:relative}.pie-emoji{position:absolute;transform:translate(-50%,-50%);z-index:2;font-size:clamp(13px,3vw,19px);width:27px;height:27px;display:grid;place-items:center;border-radius:50%;background:#fff;box-shadow:0 2px 7px #30254b30;pointer-events:none}
.pie-emoji img{width:19px;height:19px;object-fit:contain}.pie-hole{position:absolute;inset:27%;background:white;border-radius:50%;display:grid;place-items:center;text-align:center;padding:5px}
.daily-chart{display:flex;gap:10px;align-items:end;height:180px;overflow-x:auto;overflow-y:hidden;padding:8px 2px 0;scroll-behavior:smooth;touch-action:pan-y;overscroll-behavior-x:contain;cursor:grab;scrollbar-width:thin}
.daily-chart.dragging{cursor:grabbing;scroll-behavior:auto}
.daily-chart::-webkit-scrollbar{height:7px}
.daily-chart::-webkit-scrollbar-thumb{background:#d8d2ea;border-radius:999px}
.day-col{height:100%;min-width:42px;flex:0 0 42px;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:5px;cursor:pointer}
.day-bar{width:28px;max-width:100%;min-height:2px;border-radius:6px 6px 2px 2px;overflow:hidden;display:flex;flex-direction:column-reverse;background:#eeeaf5}.day-segment{width:100%;min-height:0}
.day-label{font-size:10px;color:var(--muted)}
.emoji-grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:7px;margin-top:10px;padding:3px}
.emoji-option{background:#f5f2ff;color:#38304e;border:2px solid transparent;border-radius:12px;padding:8px 2px;font-size:22px}
.emoji-option.selected{border-color:var(--purple);background:#e9e2ff}
.emoji-group{font-size:12px;color:var(--muted);font-weight:700;margin:12px 0 4px}
.emoji-selected{font-size:24px}
.add-buttons{display:flex;gap:10px;margin:14px 0}
.add-buttons button{flex:1}
.add-income{background:linear-gradient(135deg,#159a78,#36bd91)}
.add-expense{background:linear-gradient(135deg,#d94f70,#f0788e)}
.legend-table{margin-top:15px;border-top:1px solid var(--line)}.legend-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);font-size:15px}.legend-row strong{font-size:15px;white-space:nowrap}.legend-name{display:flex;align-items:center;gap:8px;min-width:0}.legend-name .legend-dot{flex:none}.day-slider{appearance:none;height:30px;background:transparent;cursor:pointer}.day-slider::-webkit-slider-runnable-track{height:4px;background:#dcd6eb;border-radius:8px}.day-slider::-moz-range-track{height:4px;background:#dcd6eb;border-radius:8px}.day-slider::-webkit-slider-thumb{appearance:none;width:18px;height:18px;border-radius:50%;background:var(--purple);margin-top:-7px;border:3px solid white;box-shadow:0 0 0 1px var(--purple)}.day-slider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--purple);border:3px solid white;box-shadow:0 0 0 1px var(--purple)}.day-col.selected .day-bar{outline:2px solid var(--purple);outline-offset:3px}.day-col.selected .day-label{color:var(--purple);font-weight:800}.day-total{font-size:16px;margin:8px 0 12px}.day-break-title{font-weight:750;margin:12px 0 4px}.keyboard-emoji{background:#f7f5ff;border-radius:12px;padding:12px;margin-bottom:14px}.keyboard-emoji label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.keyboard-emoji input{font-size:24px;text-align:center}
.chart-caption{text-align:center;color:var(--muted);font-size:12px}.day-slider{width:100%;margin-top:14px}.day-total{font-weight:750;text-align:center;margin-top:8px}.selected-day-summary{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:#f5f2ff;border-radius:14px;padding:12px 15px;margin:10px 0 12px}.selected-day-date{font-size:14px;color:var(--muted);font-weight:650}.selected-day-amount{font-size:21px;font-weight:850;color:var(--ink)}.keyboard-emoji input::placeholder{font-size:13px;color:#817d91}.emoji-modal{position:fixed;inset:0;background:#211b36;z-index:2000;display:flex;flex-direction:column;padding:12px;overflow:hidden}.emoji-modal-head{display:flex;align-items:center;justify-content:space-between;color:white;padding:5px 2px 12px}.emoji-modal-list{overflow:auto;flex:1;background:white;border-radius:16px;padding:12px}.emoji-modal-footer{padding:12px 0 4px}.emoji-modal-footer button{width:100%;padding:15px}
.daily-chart{touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;gap:8px;will-change:transform}.daily-chart:active{cursor:grabbing}.day-col{min-width:0;flex:1}.day-bar{width:min(30px,75%)}.month-position{height:3px;background:#eeeaf3;border-radius:5px;margin:15px 2px 3px;position:relative;opacity:.8}.month-position span{position:absolute;top:50%;width:17px;height:3px;border-radius:4px;background:#aaa4b8;transform:translate(-50%,-50%);transition:left .08s linear}.ops-add{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:22px;box-shadow:var(--shadow)}.ops-add h2{font-size:17px;margin:0}.ops-add .add-buttons{margin:13px 0 0}.ops-history-title{padding:0 3px;margin:0 0 9px}.ops-history-title h2{margin:0}.categories-heading{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:3px 2px 16px}.categories-heading h2{margin:0 0 3px}.category-add-btn{background:var(--purple);color:white;border-radius:14px;padding:12px 15px;white-space:nowrap;box-shadow:0 5px 13px #7057d926;font-size:13px}.categories-card{padding:17px}.categories-card h3{margin:2px 0 8px;color:#5d5474}.categories-card h3:not(:first-child){margin-top:18px;padding-top:15px;border-top:1px solid var(--line)}
@media(max-width:600px){
 .wrap{padding:12px 11px 50px}
 .grid{grid-template-columns:1fr 1fr}
 .balance-card{grid-column:1/-1}
 .big{font-size:21px}
 .formgrid{grid-template-columns:1fr}
 .full{grid-column:auto}
 header{align-items:flex-start}
 .actions{gap:4px}
 .amount{font-size:13px}
 .daily-chart{gap:2px}
 .day-label{font-size:9px}
 .emoji-grid{grid-template-columns:repeat(7,minmax(0,1fr))}
}


.type-toggle,.account-toggle{display:grid;grid-template-columns:1fr 1fr;background:var(--purple2);border:1px solid #ddd5f4;border-radius:14px;padding:3px;gap:3px}.type-toggle button,.account-toggle button{background:transparent;color:var(--muted);padding:10px 8px;border-radius:11px}.type-toggle button.active,.account-toggle button.active{background:#fff;color:var(--purple);box-shadow:0 2px 7px #30254b18}.toggle-hidden{display:none!important}
 .transfer-card{margin-top:16px;padding:15px 16px;background:#fff;border:1px solid var(--line);border-radius:16px;transition:transform .18s ease,box-shadow .18s ease}
.transfer-card:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(30,30,60,.07)}
.transfer-card .secondary{background:var(--purple2);color:var(--purple);border-color:transparent}
.balance-card{cursor: default}
.balance-details{display:block;opacity:1;margin-top:12px;overflow:visible!important;height:auto!important;max-height:none!important}
.balance-details>div{overflow:visible;min-height:auto}
.balance-details.open{display:block;opacity:1;margin-top:12px;height:auto!important;max-height:none!important}
.stat-toggle-control{position:relative;display:grid;grid-template-columns:1fr 1fr;align-items:center;width:220px;height:38px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--purple2);cursor:pointer;overflow:hidden}
.stat-toggle-control span{position:relative;z-index:2;text-align:center;font-size:13px;font-weight:700;color:var(--muted);transition:color .2s ease}
.stat-toggle-control[data-mode="expense"] span:first-child,.stat-toggle-control[data-mode="income"] span:last-child{color:var(--purple)}
.stat-toggle-control button{position:absolute;z-index:1;top:3px;left:3px;width:calc(50% - 3px);height:30px;border:0;border-radius:999px;background:#fff;box-shadow:0 2px 8px rgba(30,30,60,.12);transition:left .22s ease;pointer-events:none}
.stat-toggle-control[data-mode="income"] button{left:calc(50% + 0px)}
.sticky-tabs{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:8px;padding-bottom:8px}
button,.card,.chip,.row{transition:transform .16s ease,box-shadow .16s ease,background .16s ease,border-color .16s ease}
button:active{transform:scale(.98)}
.card{animation:none}
.summary-card{transition:box-shadow .18s ease,transform .18s ease}
.balance-card:hover{transform:none}
.balance-card{will-change:auto}
.balance-details{contain:layout;overflow:visible!important}
.balance-details>div{min-height:auto}
.modal-backdrop{position:fixed;inset:0;background:#24203888;display:grid;place-items:center;padding:12px;z-index:1000}
.modal-backdrop>.card{animation:none}
.transfer-swap{width:52px;height:52px;padding:0;margin:auto;border-radius:50%;background:var(--purple2);color:var(--purple);font-size:24px;line-height:1;display:grid;place-items:center;align-self:center;justify-self:center;border:1px solid #d9d0f4;box-shadow:0 3px 10px #7057d91c}
.color-tools{display:grid;grid-template-columns:1fr;gap:10px}
.color-tool-row{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;align-items:center;min-width:0}
.color-tool-row label{font-size:13px;color:var(--muted);font-weight:650;white-space:nowrap;overflow:visible}
.color-tool-row input[type=range]{width:100%;height:28px;margin:0;padding:0;background:transparent;appearance:none;-webkit-appearance:none;cursor:pointer;min-width:0}
.color-tool-row input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:999px;border:0;background:linear-gradient(90deg,#eeeaf5,#7057d9);box-shadow:inset 0 0 0 1px #cfc9df}
.color-tool-row input[type=range]::-moz-range-track{height:8px;border-radius:999px;border:0;background:linear-gradient(90deg,#eeeaf5,#7057d9);box-shadow:inset 0 0 0 1px #cfc9df}
#catHue::-webkit-slider-runnable-track{background:linear-gradient(90deg,#f00 0%,#ff0 17%,#0f0 33%,#0ff 50%,#00f 67%,#f0f 83%,#f00 100%)}
#catHue::-moz-range-track{background:linear-gradient(90deg,#f00 0%,#ff0 17%,#0f0 33%,#0ff 50%,#00f 67%,#f0f 83%,#f00 100%)}
#catSat::-webkit-slider-runnable-track{background:linear-gradient(90deg,#d9d9d9,#7057d9)}
#catSat::-moz-range-track{background:linear-gradient(90deg,#d9d9d9,#7057d9)}
#catBright::-webkit-slider-runnable-track{background:linear-gradient(90deg,#111,#fff)}
#catBright::-moz-range-track{background:linear-gradient(90deg,#111,#fff)}
.color-tool-row input[type=range]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:20px;height:20px;margin-top:-7px;border:2px solid #fff;border-radius:50%;background:var(--purple);box-shadow:0 0 0 1px #a69fba,0 2px 6px #0002}
.color-tool-row input[type=range]::-moz-range-thumb{width:20px;height:20px;border:2px solid #fff;border-radius:50%;background:var(--purple);box-shadow:0 0 0 1px #a69fba,0 2px 6px #0002}
.color-preview-large{width:58px;height:46px;border-radius:12px;border:1px solid var(--line);box-shadow:inset 0 0 0 1px #0000000a}
.stat-toggle-row{display:flex;justify-content:center;margin:-2px 0 14px}
.stat-toggle-control{user-select:none;-webkit-tap-highlight-color:transparent}
@keyframes fadeUp{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* Final interaction overrides */
.daily-chart{display:flex!important;gap:10px!important;align-items:end!important;height:180px!important;overflow-x:auto!important;overflow-y:hidden!important;touch-action:pan-y!important;cursor:grab!important;user-select:none;-webkit-user-select:none}
.daily-chart.dragging{cursor:grabbing!important}
.day-col{height:100%!important;min-width:42px!important;flex:0 0 42px!important}
.tx-toggle{width:100%;height:42px}
.tx-toggle span{display:flex;align-items:center;justify-content:center;white-space:nowrap}
.tx-toggle[data-mode="expense"] span:first-child,.tx-toggle[data-mode="income"] span:last-child,.tx-toggle[data-mode="card"] span:first-child,.tx-toggle[data-mode="cash"] span:last-child{color:var(--purple)}
.tx-toggle[data-mode="income"] button,.tx-toggle[data-mode="cash"] button{left:calc(50% + 0px)}
</style>
</head>
<body>

<div id="auth" class="auth">
 <h1>💰 Мой бюджет</h1>
 <p class="muted">Личные финансы с автоматическим сохранением</p>
 <h2 id="authHeading">Вход</h2>
 <form id="authForm">
  <div class="field"><label>Электронная почта</label><input id="email" type="email" required autocomplete="email"></div>
  <div class="field"><label>Пароль (минимум 6 символов)</label><input id="password" type="password" minlength="6" required autocomplete="current-password"></div>
  <button id="authSubmit">Войти</button>
  <button id="authToggle" class="secondary" type="button">Создать аккаунт</button>
 </form>
 <div id="authMessage" class="notice">Войди или создай новый аккаунт.</div>
</div>

<div id="app" class="wrap hidden">
 <header>
  <div><h1>💰 Мой бюджет</h1><div id="userEmail" class="muted"></div></div>
  <div style="margin-left:auto;text-align:right"><div id="syncStatus" class="status">Подключение…</div><button id="logout" class="secondary">Выйти</button></div>
 </header>
 <nav class="tabs sticky-tabs">
  <button class="active" data-tab="home">Главная</button>
  <button data-tab="ops">Операции</button>
  <button data-tab="cats">Категории</button>
 </nav>
 <main id="main"></main>

   const amount=Number(t.amount||0);
   if(t.type==="transfer"){
     if(t.fromAccount===account)return sum-amount;
     if(t.toAccount===account)return sum+amount;

   return sum+(t.type==="income"?amount:-amount);
 },0);
}

function timeText(t){
 if(t.createdAt){
  const d=new Date(Number(t.createdAt));
  if(!isNaN(d))return d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
 }
 return "—:—";
}
function sortTransactions(arr){

}

function iconMarkup(value){

function buildStatsMarkup(){
 const key=monthKey(statsMonth), mt=state.transactions.filter(t=>(t.date||"").startsWith(key)&&t.type!=="transfer");
 const expenses=mt.filter(t=>t.type==="expense"), incomes=mt.filter(t=>t.type==="income");
 const exp=expenses.reduce((s,t)=>s+Number(t.amount||0),0), inc=incomes.reduce((s,t)=>s+Number(t.amount||0),0), net=inc-exp;
 const elapsedDays=Math.max(1,Math.min(new Date(statsMonth.getFullYear(),statsMonth.getMonth()+1,0).getDate(),statsMonth.getFullYear()===new Date().getFullYear()&&statsMonth.getMonth()===new Date().getMonth()?new Date().getDate():statsMonth.getTime()<new Date(new Date().getFullYear(),new Date().getMonth(),1).getTime()?new Date(statsMonth.getFullYear(),statsMonth.getMonth()+1,0).getDate():1));
 const avg=exp/elapsedDays, largest=expenses.reduce((m,t)=>Math.max(m,Number(t.amount)||0),0), savePercent=inc>0?Math.round(net/inc*100):0;
 return `<section class="section" id="monthlyStats">

  <section class="section"><div class="between row"><h2 id="pieStatTitle">Структура расходов за месяц</h2></div><div class="stat-toggle-row"><div class="stat-toggle-control" data-stat="pie" data-mode="expense"><span>Расходы</span><span>Доходы</span><button type="button" aria-hidden="true"></button></div></div><div class="card" id="pieStatCard"></div></section>
  <section class="section"><div class="between row"><h2>По дням</h2><span class="muted" id="dailyMonthLabel">${monthLabel(statsMonth)}</span></div><div class="stat-toggle-row"><div class="stat-toggle-control" data-stat="daily" data-mode="expense"><span>Расходы</span><span>Доходы</span><button type="button" aria-hidden="true"></button></div></div><div class="card"><div class="daily-chart" id="dailyChart"></div><div class="month-position" aria-hidden="true"><span id="monthPositionThumb"></span></div><div class="day-total" id="dayTotal"></div><div id="dayBreakdown" class="day-breakdown"></div></div></section>
 </section>`;
}

function renderStats(){
 const mode=window.__statsMode||{pie:"expense",daily:"expense"};
 const key=monthKey(statsMonth), list=state.transactions.filter(t=>(t.date||"").startsWith(key)&&t.type===mode.pie);
 const grouped=state.categories.filter(c=>c.type===mode.pie).map(c=>({...c,sum:list.filter(t=>t.categoryId===c.id).reduce((s,t)=>s+Number(t.amount||0),0)})).filter(c=>c.sum>0).sort((a,b)=>b.sum-a.sum);
 const totalCat=grouped.reduce((s,c)=>s+c.sum,0); let angle=0;
 const stops=grouped.map(c=>{const a=angle;angle+=totalCat?c.sum/totalCat*360:0;return `${color(c.color)} ${a}deg ${angle}deg`});
 const pieStyle=stops.length?`background:conic-gradient(${stops.join(",")})`:"background:#eeeaf5";
 const title=mode.pie==="expense"?"Расходы":"Доходы";
 const pieTitle=$("pieStatTitle");
 if(pieTitle)pieTitle.textContent=`Структура ${mode.pie==="expense"?"расходов":"доходов"} за месяц`;
 const card=$("pieStatCard");
 if(card)card.innerHTML=grouped.length?`<div class="pie-wrap"><div class="pie" style="${pieStyle}"><div class="pie-hole"><div><strong>${money(totalCat)}</strong><div class="muted">Всего ${title.toLowerCase()}</div></div></div>${(()=>{let a=0;return grouped.map(c=>{const mid=a+(c.sum/(totalCat||1)*360)/2;a+=c.sum/(totalCat||1)*360;const r=mid*Math.PI/180,x=50+37*Math.sin(r),y=50-37*Math.cos(r);return `<span class="pie-emoji" style="left:${x}%;top:${y}%" title="${esc(c.name)}">${iconMarkup(c.emoji)}</span>`}).join("")})()}</div></div><div class="legend-table">${grouped.map(c=>`<div class="legend-row"><span class="legend-name"><i class="legend-dot" style="background:${color(c.color)}"></i>${iconMarkup(c.emoji)} ${esc(c.name)}</span><strong>${money(c.sum)}</strong><strong>${Math.round(c.sum/(totalCat||1)*100)}%</strong></div>`).join("")}</div>`:`<div class="empty">Добавь ${mode.pie==="expense"?"расходы":"доходы"}, чтобы увидеть диаграмму</div>`;
 renderDailyStats();
}

function renderDailyStats(){
 const mode=window.__statsMode||{pie:"expense",daily:"expense"};
 const chart=$("dailyChart"),out=$("dayTotal"),breakdown=$("dayBreakdown"),thumb=$("monthPositionThumb"),monthLabelEl=$("dailyMonthLabel");
 if(!chart)return;
 let selectedDate=window.__selectedStatsDate?new Date(window.__selectedStatsDate):new Date();
 if(statsMonth.getFullYear()!==selectedDate.getFullYear()||statsMonth.getMonth()!==selectedDate.getMonth())selectedDate=new Date(statsMonth.getFullYear(),statsMonth.getMonth(),1);
 selectedDate.setHours(12,0,0,0);
 const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
 const dateData=d=>{const key=dateKey(d),list=state.transactions.filter(t=>t.type===mode.daily&&t.date===key);const sum=list.reduce((a,t)=>a+Number(t.amount||0),0);const parts=state.categories.filter(c=>c.type===mode.daily).map(c=>({...c,sum:list.filter(t=>t.categoryId===c.id).reduce((a,t)=>a+Number(t.amount||0),0)})).filter(c=>c.sum>0);return {date:new Date(d),key,sum,parts}};
 const daysInMonth=new Date(statsMonth.getFullYear(),statsMonth.getMonth()+1,0).getDate();
 const renderWindow=()=>{
  const visible=Array.from({length:daysInMonth},(_,i)=>dateData(new Date(statsMonth.getFullYear(),statsMonth.getMonth(),i+1))),max=Math.max(1,...visible.map(d=>d.sum));
  chart.innerHTML=visible.map(d=>{const h=d.sum?Math.max(5,Math.sqrt(d.sum/max)*125):3,selected=d.key===dateKey(selectedDate);return `<div class="day-col ${selected?'selected':''}" data-date="${d.key}"><div class="day-bar" style="height:${h}px">${d.parts.map(p=>`<i class="day-segment" style="height:${p.sum/(d.sum||1)*100}%;background:${color(p.color)}"></i>`).join("")}</div><span class="day-label">${String(d.date.getDate()).padStart(2,"0")}.${String(d.date.getMonth()+1).padStart(2,"0")}</span></div>`}).join("");
  const d=dateData(selectedDate);out.innerHTML=`<div class="selected-day-summary"><div class="selected-day-date">${String(selectedDate.getDate()).padStart(2,"0")}.${String(selectedDate.getMonth()+1).padStart(2,"0")}.${selectedDate.getFullYear()}</div><div class="selected-day-amount">${money(d.sum)}</div></div>`;
  const label=mode.daily==="expense"?"Расходы":"Доходы";
  breakdown.innerHTML=d.parts.length?`<div class="day-break-title">${label} по категориям</div><div class="legend-table">${[...d.parts].sort((a,b)=>b.sum-a.sum).map(c=>`<div class="legend-row"><span class="legend-name"><i class="legend-dot" style="background:${color(c.color)}"></i>${iconMarkup(c.emoji)} ${esc(c.name)}</span><strong>${money(c.sum)}</strong><strong>${Math.round(c.sum/(d.sum||1)*100)}%</strong></div>`).join("")}</div>`:`<div class="muted">В этот день нет ${mode.daily==="expense"?"расходов":"доходов"}.</div>`;
  if(thumb)thumb.style.left=`${((selectedDate.getDate()-1)/(daysInMonth-1||1))*100}%`;if(monthLabelEl)monthLabelEl.textContent=monthLabel(statsMonth);
  const target=chart.querySelector(`[data-date="${dateKey(selectedDate)}"]`);if(target){const desired=target.offsetLeft-(chart.clientWidth-target.offsetWidth)/2;chart.scrollLeft=Math.max(0,Math.min(desired,chart.scrollWidth-chart.clientWidth));}
 };
 chart.onclick=e=>{if(moved){moved=false;return}const col=e.target.closest("[data-date]");if(col){window.__selectedStatsDate=col.dataset.date;renderDailyStats()}};
 if(!chart.dataset.dragBound){
  chart.dataset.dragBound="1";
  let pointerDown=false,dragging=false,moved=false,startX=0,startY=0,startScroll=0;
  chart.addEventListener("pointerdown",e=>{pointerDown=true;dragging=false;moved=false;startX=e.clientX;startY=e.clientY;startScroll=chart.scrollLeft});
  chart.addEventListener("pointermove",e=>{
   if(!pointerDown)return;
   const dx=e.clientX-startX,dy=e.clientY-startY;
   if(!dragging){
    if(Math.abs(dx)<8&&Math.abs(dy)<8)return;
    if(Math.abs(dy)>Math.abs(dx)){pointerDown=false;return;}
    dragging=true;moved=true;chart.classList.add("dragging");chart.setPointerCapture?.(e.pointerId);e.preventDefault();
   }
   if(dragging){chart.scrollLeft=startScroll-dx;e.preventDefault();}
  },{passive:false});
  const stop=()=>{pointerDown=false;dragging=false;chart.classList.remove("dragging")};
  chart.addEventListener("pointerup",stop);chart.addEventListener("pointercancel",stop);chart.addEventListener("lostpointercapture",stop);
  chart.addEventListener("wheel",e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){chart.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});
 }
 renderWindow();
}

function openTx(id=null,type="expense"){
 const old=id?state.transactions.find(t=>t.id===id):null;
 if(old?.type==="transfer")return openTransfer(id);
 const chosenType=old?.type||type;
 const cats=state.categories.filter(c=>c.type===chosenType);
 const chosenAccount=old?.account||"card";
 $("modal").innerHTML=`
  <div class="modal-backdrop">
   <div class="card" style="width:min(560px,100%);max-height:90vh;overflow:auto">
    <div class="between row"><h2>${old?"Изменить":"Добавить"} операцию</h2><button class="secondary" id="close">Закрыть</button></div>

function usedCategoryColors(exceptId){
  const s=new Set();
  try{((state&&state.categories)||[]).forEach(c=>{if(c.id!==exceptId&&c.color)s.add(String(c.color).toLowerCase())})}catch(e){}
  return s;
}
function suggestCategoryColor(exceptId){
  const u=usedCategoryColors(exceptId);
  const candidates=[];
  for(let i=0;i<36;i++)candidates.push(hsvToHex(Math.round(i*10),0.68,0.90));
  const free=candidates.find(c=>!u.has(c.toLowerCase()));
  if(free)return free;
  for(let i=0;i<72;i++){
    const c=hsvToHex(Math.round(i*5),0.58,0.92);
    if(!u.has(c.toLowerCase()))return c;
  }
  return hsvToHex(0,0.65,0.9);
}
function hexToHsv(hex){
  hex=hex.replace('#','');let r=parseInt(hex.slice(0,2),16)/255,g=parseInt(hex.slice(2,4),16)/255,b=parseInt(hex.slice(4,6),16)/255;
  let mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,h=0;
  if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}
  return [h,mx?d/mx:0,mx];
}
function hsvToHex(h,s,v){
  let c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c,r=0,g=0,b=0;
  if(h<60)[r,g,b]=[c,x,0];else if(h<120)[r,g,b]=[x,c,0];else if(h<180)[r,g,b]=[0,c,x];else if(h<240)[r,g,b]=[0,x,c];else if(h<300)[r,g,b]=[x,0,c];else[r,g,b]=[c,0,x];
  return '#'+[r,g,b].map(n=>Math.round((n+m)*255).toString(16).padStart(2,'0')).join('');
}
