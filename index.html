
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f3ff">
<title>Мой бюджет</title>
<style>
:root{
 --bg:#f5f3ff;--card:#fff;--ink:#28243a;--muted:#817d91;
 --line:#e9e5f2;--purple:#7057d9;--purple2:#eee9ff;
 --green:#16866a;--greenbg:#e2f7ee;
 --red:#d64e68;--redbg:#fff0f2;
 --blue:#3985d6;--orange:#e69a38;--shadow:0 8px 25px #5140800c
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
button,input,select{font:inherit}
button{border:0;border-radius:13px;padding:11px 15px;background:var(--purple);color:white;cursor:pointer;font-weight:700}
button:disabled{opacity:.5}
.secondary{background:var(--purple2);color:#5742ad}
.danger{background:var(--redbg);color:var(--red)}
.wrap{max-width:960px;margin:auto;padding:18px 15px 60px}
header,.row,.between,.tabs,.actions{display:flex;align-items:center;gap:10px}
header,.between{justify-content:space-between}
header{margin-bottom:18px}
h1{font-size:23px;margin:0}
h2{font-size:19px;margin:0 0 13px}
h3{font-size:16px;margin:12px 0}
.muted{color:var(--muted);font-size:13px}
.status{font-size:12px;text-align:right;color:var(--green);margin-bottom:5px}
.tabs{overflow:auto;margin-bottom:17px;padding:4px 0}
.tabs button{white-space:nowrap;background:transparent;color:var(--muted);padding:10px 14px}
.tabs button.active{background:var(--purple);color:white;box-shadow:0 4px 12px #7057d944}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:16px;margin-bottom:13px;min-width:0;box-shadow:var(--shadow)}
.summary-card{position:relative;overflow:hidden}
.summary-card.balance-card{background:linear-gradient(135deg,#7057d9,#9278ed);color:white;border:0;box-shadow:0 9px 24px #7057d933}
.balance-card .label,.balance-card .big{color:white}
.balance-card:after{content:"";position:absolute;width:115px;height:115px;border-radius:50%;background:#ffffff18;right:-35px;top:-40px}
.income-card{border-top:4px solid #36b98d}
.expense-card{border-top:4px solid #ed7186}
.label{font-size:13px;color:var(--muted)}
.big{font-size:clamp(20px,4vw,28px);font-weight:800;margin-top:7px;overflow-wrap:anywhere}
.green{color:var(--green)}.red{color:var(--red)}
.section{margin-top:22px}
.tx,.category{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}
.tx:last-child,.category:last-child{border-bottom:0}
.dot{width:42px;height:42px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:21px}
.txmain{flex:1;min-width:0}
.txmain strong{display:block;overflow-wrap:anywhere}
.txmain small{display:block;color:var(--muted);font-size:12px}
.amount{font-weight:800;white-space:nowrap}
.actions button{padding:7px 9px;font-size:12px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}
.field label{font-size:13px;color:var(--muted);font-weight:650}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--ink)}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.full{grid-column:1/-1}
.empty{text-align:center;padding:25px;color:var(--muted)}
.auth{max-width:420px;margin:8vh auto;background:white;padding:23px;border-radius:22px;border:1px solid var(--line);box-shadow:var(--shadow)}
.notice{background:var(--purple2);padding:12px;border-radius:12px;font-size:13px;margin-top:12px}
.warn{background:var(--redbg);color:#a83248}
.hidden{display:none!important}
input[type=color]{appearance:none;-webkit-appearance:none;width:58px;height:46px;padding:3px;border:1px solid #ddd5f4;border-radius:8px;overflow:hidden;background:white;cursor:pointer}input[type=color]::-webkit-color-swatch-wrapper{padding:0}input[type=color]::-webkit-color-swatch{border:0;border-radius:4px}
.color-preview{width:46px;height:46px;border-radius:6px;border:0;box-shadow:none}
.color-row{display:flex;align-items:center;gap:13px}
.month-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:5px 0 15px}
.month-nav button{width:44px;height:44px;padding:0;font-size:24px}
.stat-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-mini{background:#f7f5ff;border-radius:14px;padding:12px;min-width:0}
.stat-mini strong{display:block;font-size:18px;overflow-wrap:anywhere}
.chart-legend{display:flex;flex-wrap:wrap;gap:9px 14px;font-size:12px;margin-top:13px}
.legend-item{display:flex;align-items:center;gap:6px}
.legend-dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.pie{width:min(230px,65vw);aspect-ratio:1;border-radius:50%;margin:8px auto;position:relative}
.pie-hole{position:absolute;inset:27%;background:white;border-radius:50%;display:grid;place-items:center;text-align:center;padding:5px}
.daily-chart{display:flex;gap:10px;align-items:end;height:180px;overflow:hidden;padding:8px 2px 0}
.day-col{height:100%;min-width:42px;flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:5px;cursor:pointer}
.day-bar{width:28px;max-width:100%;min-height:2px;border-radius:6px 6px 2px 2px;overflow:hidden;display:flex;flex-direction:column-reverse;background:#eeeaf5}.day-segment{width:100%;min-height:0}
.day-label{font-size:10px;color:var(--muted)}
.emoji-grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:7px;margin-top:10px;padding:3px}
.emoji-option{background:#f5f2ff;color:#38304e;border:2px solid transparent;border-radius:12px;padding:8px 2px;font-size:22px}
.emoji-option.selected{border-color:var(--purple);background:#e9e2ff}
.emoji-group{font-size:12px;color:var(--muted);font-weight:700;margin:12px 0 4px}
.emoji-selected{font-size:24px}
.add-buttons{display:flex;gap:10px;margin:14px 0}
.add-buttons button{flex:1}
.add-income{background:linear-gradient(135deg,#159a78,#36bd91)}
.add-expense{background:linear-gradient(135deg,#d94f70,#f0788e)}
.legend-table{margin-top:15px;border-top:1px solid var(--line)}.legend-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);font-size:15px}.legend-row strong{font-size:15px;white-space:nowrap}.legend-name{display:flex;align-items:center;gap:8px;min-width:0}.legend-name .legend-dot{flex:none}.day-slider{appearance:none;height:30px;background:transparent;cursor:pointer}.day-slider::-webkit-slider-runnable-track{height:4px;background:#dcd6eb;border-radius:8px}.day-slider::-moz-range-track{height:4px;background:#dcd6eb;border-radius:8px}.day-slider::-webkit-slider-thumb{appearance:none;width:18px;height:18px;border-radius:50%;background:var(--purple);margin-top:-7px;border:3px solid white;box-shadow:0 0 0 1px var(--purple)}.day-slider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--purple);border:3px solid white;box-shadow:0 0 0 1px var(--purple)}.day-col.selected .day-bar{outline:2px solid var(--purple);outline-offset:3px}.day-col.selected .day-label{color:var(--purple);font-weight:800}.day-total{font-size:16px;margin:8px 0 12px}.day-break-title{font-weight:750;margin:12px 0 4px}.keyboard-emoji{background:#f7f5ff;border-radius:12px;padding:12px;margin-bottom:14px}.keyboard-emoji label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.keyboard-emoji input{font-size:24px;text-align:center}
.chart-caption{text-align:center;color:var(--muted);font-size:12px}.day-slider{width:100%;margin-top:14px}.day-total{font-weight:750;text-align:center;margin-top:8px}.emoji-modal{position:fixed;inset:0;background:#211b36;z-index:20;display:flex;flex-direction:column;padding:12px;overflow:hidden}.emoji-modal-head{display:flex;align-items:center;justify-content:space-between;color:white;padding:5px 2px 12px}.emoji-modal-list{overflow:auto;flex:1;background:white;border-radius:16px;padding:12px}.emoji-modal-footer{padding:12px 0 4px}.emoji-modal-footer button{width:100%;padding:15px}
@media(max-width:600px){
 .wrap{padding:12px 11px 50px}
 .grid{grid-template-columns:1fr 1fr}
 .balance-card{grid-column:1/-1}
 .big{font-size:21px}
 .formgrid{grid-template-columns:1fr}
 .full{grid-column:auto}
 header{align-items:flex-start}
 .actions{gap:4px}
 .amount{font-size:13px}
 .daily-chart{gap:2px}
 .day-label{font-size:9px}
 .emoji-grid{grid-template-columns:repeat(7,minmax(0,1fr))}
}
</style>
</head>
<body>

<div id="auth" class="auth">
 <h1>💰 Мой бюджет</h1>
 <p class="muted">Личные финансы с автоматическим сохранением</p>
 <h2 id="authHeading">Вход</h2>
 <form id="authForm">
  <div class="field"><label>Электронная почта</label><input id="email" type="email" required autocomplete="email"></div>
  <div class="field"><label>Пароль (минимум 6 символов)</label><input id="password" type="password" minlength="6" required autocomplete="current-password"></div>
  <button id="authSubmit">Войти</button>
  <button id="authToggle" class="secondary" type="button">Создать аккаунт</button>
 </form>
 <div id="authMessage" class="notice">Войди или создай новый аккаунт.</div>
</div>

<div id="app" class="wrap hidden">
 <header>
  <div><h1>💰 Мой бюджет</h1><div id="userEmail" class="muted"></div></div>
  <div><div id="syncStatus" class="status">Подключение…</div><button id="logout" class="secondary">Выйти</button></div>
 </header>
 <nav class="tabs">
  <button class="active" data-tab="home">Главная</button>
  <button data-tab="ops">Операции</button>
  <button data-tab="cats">Категории</button>
 </nav>
 <main id="main"></main>
</div>
<div id="modal"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,onSnapshot,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyDNwgu0ESNjpsteOss8uM8VYSHL8wE4lJw",
 authDomain:"rashody-72837.firebaseapp.com",
 projectId:"rashody-72837",
 storageBucket:"rashody-72837.firebasestorage.app",
 messagingSenderId:"519636263745",
 appId:"1:519636263745:web:6c397e334fe28f655677c0"
};

const fb=initializeApp(firebaseConfig);
const auth=getAuth(fb);
const db=getFirestore(fb);
const $=id=>document.getElementById(id);
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const money=n=>new Intl.NumberFormat("ru-RU",{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(n)||0)+" BYN";

const defaultCats=[
 {id:"food",name:"Продукты",type:"expense",emoji:"🛒",color:"#f6d98b"},
 {id:"home",name:"Дом и счета",type:"expense",emoji:"🏠",color:"#a8c9fa"},
 {id:"transport",name:"Транспорт",type:"expense",emoji:"🚗",color:"#f8c39b"},
 {id:"health",name:"Здоровье",type:"expense",emoji:"💊",color:"#f3b6ce"},
 {id:"fun",name:"Развлечения",type:"expense",emoji:"🎬",color:"#cbb8fa"},
 {id:"shopping",name:"Покупки",type:"expense",emoji:"🛍️",color:"#f6c9a4"},
 {id:"salary",name:"Зарплата",type:"income",emoji:"💼",color:"#9ce2c5"},
 {id:"otherincome",name:"Другие доходы",type:"income",emoji:"💎",color:"#a8dfe8"},
 {id:"other",name:"Прочее",type:"expense",emoji:"📦",color:"#d8d5e2"}
];
const fresh=()=>({currency:"BYN",transactions:[],categories:structuredClone(defaultCats)});
let state=fresh(),user=null,unsubscribe=null,saveTimer=null,mode="login",tab="home",statsMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);
const localKey=uid=>"budget-local-v1-"+uid;
const userDoc=()=>doc(db,"users",user.uid,"budget","state");

function status(text,isError=false){$("syncStatus").textContent=text;$("syncStatus").style.color=isError?"#d64e68":"#16866a"}
function say(text,error=false){$("authMessage").textContent=text;$("authMessage").className="notice"+(error?" warn":"")}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function color(v){return /^#[0-9a-f]{3,8}$/i.test(v||"")?v:"#d8d5e2"}
function normalize(s){
 if(!s||typeof s!=="object")return fresh();
 return {currency:"BYN",transactions:Array.isArray(s.transactions)?s.transactions:[],categories:Array.isArray(s.categories)&&s.categories.length?s.categories:structuredClone(defaultCats)}
}
function persistLocal(){try{localStorage.setItem(localKey(user.uid),JSON.stringify(state))}catch(e){status("Ошибка локального сохранения",true)}}
function save(){
 if(!user)return;
 persistLocal();status("Сохранение…");clearTimeout(saveTimer);
 saveTimer=setTimeout(async()=>{
  const snapshot=JSON.parse(JSON.stringify(state));
  try{await setDoc(userDoc(),{data:snapshot,updatedAt:serverTimestamp(),schemaVersion:1});status("Сохранено в облаке")}
  catch(e){console.error(e);status("Ошибка облака — проверь интернет и правила",true)}
 },500);
}
function change(fn){fn();save();render()}
function total(type){return state.transactions.filter(t=>t.type===type).reduce((s,t)=>s+Number(t.amount||0),0)}
function balance(){return total("income")-total("expense")}
function category(id){return state.categories.find(c=>c.id===id)||{name:"Без категории",emoji:"📦",color:"#d8d5e2"}}
function dateText(s){if(!s)return"";const a=s.split("-");return a.length===3?`${a[2]}.${a[1]}.${a[0]}`:s}
function timeText(t){
 if(t.createdAt){
  const d=new Date(Number(t.createdAt));
  if(!isNaN(d))return d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
 }
 return "—:—";
}
function sortTransactions(arr){
 return [...arr].sort((a,b)=>{
  const ta=Number(a.createdAt)||new Date((a.date||"1970-01-01")+"T00:00:00").getTime();
  const tb=Number(b.createdAt)||new Date((b.date||"1970-01-01")+"T00:00:00").getTime();
  return tb-ta;
 });
}
function summary(label,value,cls="",extra=""){
 return `<div class="card summary-card ${extra}"><div class="label">${label}</div><div class="big ${cls}">${value}</div></div>`;
}
function txHtml(t,editable=true){
 const c=category(t.categoryId);
 return `<div class="tx">
 <div class="dot" style="background:${color(c.color)}">${esc(c.emoji)}</div>
 <div class="txmain"><strong>${esc(c.name)}</strong><small>${dateText(t.date)} · ${timeText(t)}</small></div>
 <div class="amount ${t.type==="income"?"green":"red"}">${t.type==="income"?"+":"−"}${money(t.amount)}</div>
 ${editable?`<div class="actions"><button class="secondary" data-edit="${esc(t.id)}">Изм.</button></div>`:""}
 </div>`;
}
function monthKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`}
function monthLabel(d){return new Intl.DateTimeFormat("ru-RU",{month:"long",year:"numeric"}).format(d).replace(/^./,m=>m.toUpperCase())}

function buildStatsMarkup(){
 const key=monthKey(statsMonth), mt=state.transactions.filter(t=>(t.date||"").startsWith(key));
 const expenses=mt.filter(t=>t.type==="expense"), incomes=mt.filter(t=>t.type==="income");
 const exp=expenses.reduce((s,t)=>s+Number(t.amount||0),0), inc=incomes.reduce((s,t)=>s+Number(t.amount||0),0), net=inc-exp;
 const grouped=state.categories.filter(c=>c.type==="expense").map(c=>({...c,sum:expenses.filter(t=>t.categoryId===c.id).reduce((s,t)=>s+Number(t.amount||0),0)})).filter(c=>c.sum>0).sort((a,b)=>b.sum-a.sum);
 const totalCat=grouped.reduce((s,c)=>s+c.sum,0); let angle=0;
 const stops=grouped.map(c=>{const a=angle;angle+=totalCat?c.sum/totalCat*360:0;return `${color(c.color)} ${a}deg ${angle}deg`});
 const pieStyle=stops.length?`background:conic-gradient(${stops.join(",")})`:"background:#eeeaf5";
 const days=new Date(statsMonth.getFullYear(),statsMonth.getMonth()+1,0).getDate();
 const daily=Array.from({length:days},(_,i)=>{const day=i+1, list=expenses.filter(t=>Number((t.date||"").slice(8,10))===day);return {day,sum:list.reduce((a,t)=>a+Number(t.amount||0),0),parts:state.categories.map(c=>({color:c.color,sum:list.filter(t=>t.categoryId===c.id).reduce((a,t)=>a+Number(t.amount||0),0)})).filter(x=>x.sum>0)}});
 const avg=days?exp/days:0, largest=expenses.reduce((m,t)=>Math.max(m,Number(t.amount)||0),0), savePercent=inc>0?Math.round(net/inc*100):0;
 return `<section class="section" id="monthlyStats"><div class="month-nav"><button class="secondary" id="prevMonth">‹</button><h2 style="margin:0;text-align:center;flex:1">${monthLabel(statsMonth)}</h2><button class="secondary" id="nextMonth">›</button></div>
 <div class="grid">${summary("Остаток за месяц",money(net),net>=0?"":"red","balance-card")}${summary("Доходы",money(inc),"green","income-card")}${summary("Расходы",money(exp),"red","expense-card")}</div>
 <section class="section"><h2>Показатели месяца</h2><div class="card"><div class="stat-pair"><div class="stat-mini"><span class="label">Операций</span><strong>${mt.length}</strong></div><div class="stat-mini"><span class="label">Средний расход в день</span><strong>${money(avg)}</strong></div><div class="stat-mini"><span class="label">Самый крупный расход</span><strong>${money(largest)}</strong></div><div class="stat-mini"><span class="label">Доля остатка от дохода</span><strong>${inc>0?savePercent+"%":"—"}</strong></div></div></div></section>
 <section class="section"><h2>Структура расходов за месяц</h2><div class="card">${grouped.length?`<div class="pie" style="${pieStyle}"><div class="pie-hole"><div><strong>${money(exp)}</strong><div class="muted">Всего</div></div></div></div><div class="legend-table">${grouped.map(c=>`<div class="legend-row"><span class="legend-name"><i class="legend-dot" style="background:${color(c.color)}"></i>${esc(c.emoji)} ${esc(c.name)}</span><strong>${money(c.sum)}</strong><strong>${Math.round(c.sum/(totalCat||1)*100)}%</strong></div>`).join("")}</div>`:'<div class="empty">Добавь расходы, чтобы увидеть диаграмму</div>'}</div></section>
 <section class="section"><div class="between row"><h2>Расходы по дням</h2><span class="muted">${monthLabel(statsMonth)}</span></div><div class="card"><div class="daily-chart" id="dailyChart"></div><input class="day-slider" id="daySlider" type="range" min="1" max="${days}" value="${statsMonth.getFullYear()===new Date().getFullYear()&&statsMonth.getMonth()===new Date().getMonth()?new Date().getDate():days}" step="1"><div class="day-total" id="dayTotal"></div><div id="dayBreakdown" class="day-breakdown"></div></div></section></section>`;
 function dayBar(d){const max=Math.max(1,...daily.map(x=>x.sum));const h=d.sum?Math.max(5,Math.sqrt(d.sum/max)*125):3;return `<div class="day-col" data-day="${d.day}" title="${d.day} число"><div class="day-bar" style="height:${h}px">${d.parts.map(p=>`<i class="day-segment" style="height:${p.sum/(d.sum||1)*100}%;background:${color(p.color)}"></i>`).join("")}</div><span class="day-label">${d.day}</span></div>`}
}
function attachStatsHandlers(){
 const prev=$("prevMonth"),next=$("nextMonth");if(prev)prev.onclick=()=>{statsMonth=new Date(statsMonth.getFullYear(),statsMonth.getMonth()-1,1);render()};if(next)next.onclick=()=>{statsMonth=new Date(statsMonth.getFullYear(),statsMonth.getMonth()+1,1);render()};
 const slider=$("daySlider"),chart=$("dailyChart"),out=$("dayTotal"),breakdown=$("dayBreakdown");if(!slider||!chart)return;
 const days=Number(slider.max);
 const daily=Array.from({length:days},(_,i)=>{const day=i+1,date=`${monthKey(statsMonth)}-${String(day).padStart(2,"0")}`;const list=state.transactions.filter(t=>t.type==="expense"&&t.date===date);return {day,date,sum:list.reduce((a,t)=>a+Number(t.amount||0),0),parts:state.categories.filter(c=>c.type==="expense").map(c=>({...c,sum:list.filter(t=>t.categoryId===c.id).reduce((a,t)=>a+Number(t.amount||0),0)})).filter(x=>x.sum>0)}});
 const renderWindow=()=>{const selected=Number(slider.value),start=Math.max(1,Math.min(Math.max(1,days-6),selected-3));const visible=daily.slice(start-1,start+6);const max=Math.max(1,...daily.map(d=>d.sum));chart.innerHTML=visible.map(d=>{const h=d.sum?Math.max(5,Math.sqrt(d.sum/max)*125):3;return `<div class="day-col ${d.day===selected?'selected':''}" data-day="${d.day}"><div class="day-bar" style="height:${h}px">${d.parts.map(p=>`<i class="day-segment" style="height:${p.sum/(d.sum||1)*100}%;background:${color(p.color)}"></i>`).join("")}</div><span class="day-label">${String(d.day).padStart(2,"0")}.${String(statsMonth.getMonth()+1).padStart(2,"0")}</span></div>`}).join("");
 chart.querySelectorAll('[data-day]').forEach(el=>el.onclick=()=>{slider.value=el.dataset.day;renderWindow()});
 const d=daily[selected-1];out.textContent=`${String(selected).padStart(2,"0")}.${String(statsMonth.getMonth()+1).padStart(2,"0")}.${statsMonth.getFullYear()} · ${money(d.sum)}`;
 breakdown.innerHTML=d.parts.length?`<div class="day-break-title">Расходы по категориям</div><div class="legend-table">${[...d.parts].sort((a,b)=>b.sum-a.sum).map(c=>`<div class="legend-row"><span class="legend-name"><i class="legend-dot" style="background:${color(c.color)}"></i>${esc(c.emoji)} ${esc(c.name)}</span><strong>${money(c.sum)}</strong><strong>${Math.round(c.sum/(d.sum||1)*100)}%</strong></div>`).join("")}</div>`:'<div class="muted">В этот день расходов нет</div>';
 };slider.oninput=renderWindow;renderWindow();
}

function render(){
 if(!user)return;
 document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
 const tx=sortTransactions(state.transactions);

 if(tab==="home"){
  const statsMarkup=buildStatsMarkup();
  $("main").innerHTML=`
  <div class="add-buttons">
   <button class="add-income" data-add="income">＋ Доход</button>
   <button class="add-expense" data-add="expense">− Расход</button>
  </div>
  <section class="section"><div class="between row"><h2>Последние операции</h2><button class="secondary" data-goto="ops">Все</button></div>
   <div class="card">${tx.length?tx.slice(0,5).map(t=>txHtml(t,false)).join(""):'<div class="empty">Пока нет операций</div>'}</div>
  </section>${statsMarkup}`;
  attachStatsHandlers();
 }
 else if(tab==="ops"){
  $("main").innerHTML=`
  <div class="between row"><h2>История операций</h2></div>
  <div class="add-buttons">
   <button class="add-income" data-add="income">＋ Доход</button>
   <button class="add-expense" data-add="expense">− Расход</button>
  </div>
  <div class="card">${tx.length?tx.map(t=>txHtml(t)).join(""):'<div class="empty">Операций пока нет</div>'}</div>`;
 }
 else if(tab==="cats"){
  $("main").innerHTML=`
  <div class="between row"><h2>Категории</h2><button data-catnew>＋ Добавить</button></div>
  <div class="card"><h3>Расходы</h3>${state.categories.filter(c=>c.type==="expense").map(catHtml).join("")}
  <h3>Доходы</h3>${state.categories.filter(c=>c.type==="income").map(catHtml).join("")}</div>`;
 }
 else if(tab==="stats"){tab="home";render();return;
 }

 document.querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>{tab=b.dataset.goto;render()});
 document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>openTx(null,b.dataset.add));
 document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openTx(b.dataset.edit));
 document.querySelectorAll("[data-catnew]").forEach(b=>b.onclick=()=>openCat());
 document.querySelectorAll("[data-editcat]").forEach(b=>b.onclick=()=>openCat(b.dataset.editcat));
 document.querySelectorAll("[data-delcat]").forEach(b=>b.onclick=()=>deleteCat(b.dataset.delcat));
}

function catHtml(c){
 return `<div class="category">
 <div class="dot" style="background:${color(c.color)}">${esc(c.emoji)}</div>
 <strong style="flex:1">${esc(c.name)}</strong>
 <button class="secondary" data-editcat="${esc(c.id)}">Изм.</button>
 <button class="danger" data-delcat="${esc(c.id)}">×</button>
 </div>`;
}
function closeModal(){$("modal").innerHTML=""}

function openTx(id=null,type="expense"){
 const old=id?state.transactions.find(t=>t.id===id):null;
 const chosenType=old?.type||type;
 const cats=state.categories.filter(c=>c.type===chosenType);
 $("modal").innerHTML=`
 <div style="position:fixed;inset:0;background:#24203888;display:grid;place-items:center;padding:12px;z-index:5">
  <div class="card" style="width:min(560px,100%);max-height:90vh;overflow:auto">
   <div class="between row"><h2>${old?"Изменить":"Добавить"} операцию</h2><button class="secondary" id="close">Закрыть</button></div>
   <form id="txForm">
    <div class="formgrid">
     <div class="field"><label>Тип</label><select name="type" id="txType">
      <option value="expense" ${chosenType==="expense"?"selected":""}>Расход</option>
      <option value="income" ${chosenType==="income"?"selected":""}>Доход</option>
     </select></div>
     <div class="field"><label>Сумма (BYN)</label><input name="amount" type="number" min=".01" step=".01" required value="${old?esc(old.amount):""}" inputmode="decimal"></div>
     <div class="field"><label>Категория</label><select name="categoryId" id="txCat">
      ${cats.map(c=>`<option value="${esc(c.id)}" ${old?.categoryId===c.id?"selected":""}>${esc(c.emoji)} ${esc(c.name)}</option>`).join("")}
     </select></div>
     <div class="field"><label>Дата</label><input name="date" type="date" required value="${esc(old?.date||today())}"></div>
    </div>
    <button>Сохранить</button>
    ${old?'<button type="button" class="danger" id="deleteTx">Удалить</button>':""}
   </form>
  </div>
 </div>`;
 $("close").onclick=closeModal;
 $("txType").onchange=()=>{
  $("txCat").innerHTML=state.categories.filter(c=>c.type===$("txType").value).map(c=>`<option value="${esc(c.id)}">${esc(c.emoji)} ${esc(c.name)}</option>`).join("");
 };
 $("txForm").onsubmit=e=>{
  e.preventDefault();
  const f=new FormData(e.currentTarget),amount=Number(f.get("amount"));
  if(!(amount>0))return alert("Сумма должна быть больше нуля");
  const t={
   id:old?.id||crypto.randomUUID(),
   type:f.get("type"),amount,date:f.get("date"),
   categoryId:f.get("categoryId"),
   createdAt:old?.createdAt||Date.now()
  };
  change(()=>{
   if(old)state.transactions=state.transactions.map(x=>x.id===old.id?t:x);
   else state.transactions.push(t);
  });
  closeModal();
 };
 if(old)$("deleteTx").onclick=()=>{
  if(confirm("Удалить операцию?")){
   change(()=>state.transactions=state.transactions.filter(t=>t.id!==old.id));
   closeModal();
  }
 };
}

const emojiGroups={
 "Еда и кафе":["ЯЕ","🍽️","🥣","🍴","☕","🥡","🍔","🍕","🥗","🍞","🥛","🛒"],
 "Дом и счета":["🏠","🏢","🛋️","🛏️","🚿","💡","🔌","🧹","🧺","🧼","🔑","🪴"],
 "Транспорт и поездки":["⛽","🚗","🚕","🚖","ЯТ","🚌","🚆","🚲","🅿️","🛞","🧳","✈️"],
 "Магазины и покупки":["WB","OZON","🛍️","📦","🛒","👕","👟","👜","👓","⌚","💄","🎁","🧴","🪒"],
 "Здоровье и уход":["💊","🏥","🦷","🩺","💇","💈","💅","🧖","🧴","🩹","👓"],
 "Работа и обучение":["💼","💻","📱","📚","🎓","🖊️","🖨️","📊","🧰"],
 "Досуг и спорт":["🎬","🎮","🎧","🎟️","🎨","⚽","🏋️","🚴","🏕️","🏖️","🎳"],
 "Семья и питомцы":["👨‍👩‍👧","👶","🎁","🐾","🐕","🐈"],
 "Финансы и услуги":["💳","💰","🏦","🧾","📮","📦","📱","🌐"],
 "Доходы":["💵","💶","💷","💼","🪙","🏆","🎁","📈"]
};

function openCat(id=null){
 const old=id?state.categories.find(c=>c.id===id):null;
 const selectedEmoji=old?.emoji||"🛒";
 $("modal").innerHTML=`
 <div style="position:fixed;inset:0;background:#24203888;display:grid;place-items:center;padding:12px;z-index:5">
  <div class="card" style="width:min(540px,100%);max-height:92vh;overflow:auto">
   <div class="between row"><h2>${old?"Изменить":"Новая"} категория</h2><button class="secondary" id="close">Закрыть</button></div>
   <form id="catForm">
    <div class="field"><label>Название</label><input name="name" required maxlength="45" value="${esc(old?.name||"")}"></div>
    <div class="field"><label>Тип</label><select name="type" ${old?"disabled":""}>
     <option value="expense" ${old?.type!=="income"?"selected":""}>Расход</option>
     <option value="income" ${old?.type==="income"?"selected":""}>Доход</option>
    </select></div>
    <div class="field"><label>Значок</label>
     <div class="row" style="align-items:center;gap:10px">
      <span id="emojiSelected" class="emoji-selected">${selectedEmoji}</span>
      <button type="button" class="secondary" id="toggleEmojiPicker">Выбрать значок</button>
     </div>
     <input type="hidden" name="emoji" id="emojiValue" value="${selectedEmoji}">
     
    </div>
    <div class="field"><label>Цвет категории</label>
     <input name="color" id="catColor" type="color" value="${color(old?.color||"#b9a8f5")}">
    </div>
    <button>Сохранить</button>
   </form>
  </div>
 </div>`;
 $("close").onclick=closeModal;
 $("toggleEmojiPicker").onclick=()=>{
  const modal=document.createElement("div");modal.className="emoji-modal";
  modal.innerHTML=`<div class="emoji-modal-head"><strong>Выбери значок</strong><button type="button" class="secondary" id="emojiCancel">Закрыть</button></div><div class="emoji-modal-list" id="emojiList"><div class="keyboard-emoji"><label for="customEmoji">Или выбери эмодзи на клавиатуре</label><input id="customEmoji" type="text" maxlength="8" placeholder="Нажми сюда и открой эмодзи" value=""></div>${Object.entries(emojiGroups).map(([group,emojis])=>`<div class="emoji-group">${group}</div><div class="emoji-grid">${emojis.map(em=>`<button type="button" class="emoji-option ${em===($("emojiValue").value) ? "selected":""}" data-emoji="${em}">${em}</button>`).join("")}</div>`).join("")}</div><div class="emoji-modal-footer"><button type="button" id="emojiChoose">Выбрать</button></div>`;
  document.body.appendChild(modal);let pending=$("emojiValue").value;
  modal.querySelector("#customEmoji").addEventListener("input",e=>{const v=e.target.value.trim();if(v){pending=v;modal.querySelectorAll(".emoji-option").forEach(x=>x.classList.remove("selected"));}});
  modal.querySelectorAll("[data-emoji]").forEach(b=>b.onclick=()=>{pending=b.dataset.emoji;modal.querySelectorAll(".emoji-option").forEach(x=>x.classList.toggle("selected",x===b))});
  modal.querySelector("#emojiCancel").onclick=()=>modal.remove();
  modal.querySelector("#emojiChoose").onclick=()=>{$("emojiValue").value=pending;$("emojiSelected").textContent=pending;modal.remove()};
 };
 $("catForm").onsubmit=e=>{
  e.preventDefault();
  const f=new FormData(e.currentTarget);
  const c={
   id:old?.id||crypto.randomUUID(),
   name:String(f.get("name")).trim(),
   type:old?.type||f.get("type"),
   emoji:String(f.get("emoji")||"📌"),
   color:f.get("color")
  };
  change(()=>{
   if(old)state.categories=state.categories.map(x=>x.id===old.id?c:x);
   else state.categories.push(c);
  });
  closeModal();
 };
}

function deleteCat(id){
 const c=category(id);
 if(state.transactions.some(t=>t.categoryId===id))return alert("Сначала измени категорию у связанных операций.");
 if(confirm(`Удалить категорию «${c.name}»?`))change(()=>state.categories=state.categories.filter(c=>c.id!==id));
}

$("authToggle").onclick=()=>{
 mode=mode==="login"?"register":"login";
 $("authHeading").textContent=mode==="login"?"Вход":"Создать аккаунт";
 $("authSubmit").textContent=mode==="login"?"Войти":"Зарегистрироваться";
 $("authToggle").textContent=mode==="login"?"Создать аккаунт":"У меня уже есть аккаунт";
 $("password").autocomplete=mode==="login"?"current-password":"new-password";
};
$("authForm").onsubmit=async e=>{
 e.preventDefault();$("authSubmit").disabled=true;say("Подключение…");
 try{
  const email=$("email").value.trim(),password=$("password").value;
  if(mode==="register")await createUserWithEmailAndPassword(auth,email,password);
  else await signInWithEmailAndPassword(auth,email,password);
 }catch(e){
  console.error(e);let msg=e.message;
  if(e.code==="auth/email-already-in-use")msg="Этот адрес уже зарегистрирован — войди в аккаунт.";
  if(e.code==="auth/invalid-credential")msg="Неверная почта или пароль.";
  if(e.code==="auth/operation-not-allowed")msg="Включи Email/Password в Firebase Authentication.";
  say(msg,true);
 }finally{$("authSubmit").disabled=false}
};
$("logout").onclick=()=>signOut(auth);
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});

onAuthStateChanged(auth,async u=>{
 if(unsubscribe){unsubscribe();unsubscribe=null}
 user=u;
 if(!u){
  $("app").classList.add("hidden");$("auth").classList.remove("hidden");return;
 }
 $("auth").classList.add("hidden");$("app").classList.remove("hidden");
 $("userEmail").textContent=u.email||"Личный аккаунт";
 status("Загрузка…");
 const key=localKey(u.uid),local=localStorage.getItem(key);
 try{state=local?normalize(JSON.parse(local)):fresh()}catch{state=fresh()}
 render();
 const ref=userDoc();
 try{
  const snap=await getDoc(ref);
  if(snap.exists()){
   state=normalize(snap.data().data);
   persistLocal();render();
  }else{
   await setDoc(ref,{data:state,updatedAt:serverTimestamp(),schemaVersion:1});
  }
  status("Сохранено в облаке");
 }catch(e){console.error(e);status("Ошибка облака — проверь настройки",true)}
 unsubscribe=onSnapshot(ref,snap=>{
  if(!snap.exists())return;
  if(saveTimer)return;
  state=normalize(snap.data().data);
  persistLocal();render();status("Синхронизировано");
 },e=>{console.error(e);status("Ошибка синхронизации",true)});
});
</script>
</body>
